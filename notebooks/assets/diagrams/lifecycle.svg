<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Implicit Decision Gate lifecycle</title>
  <desc id="description">A human brief produces a first artifact, typed policy evaluation, an optional owner pause, and a clean retry through the full policy pipeline.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58708f"/></marker><style>.lane{stroke:#d6dde8;stroke-width:2}.head{fill:#eef4ff;stroke:#9eb7e3;stroke-width:2;rx:10}.h{font:700 15px system-ui,sans-serif;fill:#17325c;text-anchor:middle}.t{font:13px system-ui,sans-serif;fill:#46556d;text-anchor:middle}.msg{stroke:#58708f;stroke-width:2;marker-end:url(#arrow)}.phase{fill:#fff;stroke:#d6dde8;stroke-width:2;rx:12}.accent{fill:#f8f5ff;stroke:#7c55c7}.owner{fill:#fffaf0;stroke:#b36a00}.done{fill:#f0faf6;stroke:#198754}</style></defs>
  <rect width="1280" height="720" fill="#fbfcff"/><text x="640" y="35" class="h" style="font-size:24px">Durable contract completion with full retry verification</text>
  <g transform="translate(45 65)"><rect class="head" width="180" height="50"/><text x="90" y="31" class="h">Human owner</text></g><g transform="translate(310 65)"><rect class="head" width="180" height="50"/><text x="90" y="31" class="h">Gate and store</text></g><g transform="translate(575 65)"><rect class="head" width="180" height="50"/><text x="90" y="31" class="h">Coding attempt</text></g><g transform="translate(840 65)"><rect class="head" width="180" height="50"/><text x="90" y="31" class="h">Typed observer</text></g><g transform="translate(1105 65)"><rect class="head" width="135" height="50"/><text x="67" y="31" class="h">Reviewer</text></g>
  <path class="lane" d="M135 115 V680M400 115 V680M665 115 V680M930 115 V680M1172 115 V680"/>
  <path class="msg" d="M135 150 H392"/><text x="264" y="143" class="t">Brief</text><path class="msg" d="M400 195 H657"/><text x="528" y="188" class="t">Pinned prompt</text><path class="msg" d="M665 240 H922"/><text x="794" y="233" class="t">Generated artifact</text>
  <g transform="translate(815 265)"><rect class="phase accent" width="230" height="105"/><text x="115" y="29" class="h">Attempt assessment</text><text x="115" y="53" class="t">Invariants and decisions</text><text x="115" y="74" class="t">Effect dispositions</text><text x="115" y="95" class="t">Coverage manifest</text></g>
  <path class="msg" d="M922 390 H408"/><text x="665" y="383" class="t">Persist typed evidence and policy digest</text><path class="msg" d="M408 435 H1164"/><text x="785" y="428" class="t">Review declared owner decisions only</text><path class="msg" d="M1164 475 H408"/><text x="785" y="468" class="t">Evidence classifications</text>
  <g transform="translate(45 500)"><rect class="phase owner" width="180" height="80"/><text x="90" y="31" class="h">One owner pause</text><text x="90" y="56" class="t">Typed answers</text></g><path class="msg" d="M400 520 H233"/><path class="msg" d="M225 560 H392"/>
  <g transform="translate(575 500)"><rect class="phase" width="180" height="80"/><text x="90" y="31" class="h">Fresh attempt two</text><text x="90" y="56" class="t">Completed intent</text></g><path class="msg" d="M408 540 H567"/>
  <g transform="translate(815 600)"><rect class="phase accent" width="230" height="70"/><text x="115" y="29" class="h">Full policy recheck</text><text x="115" y="52" class="t">Then exact decision match</text></g><path class="msg" d="M665 610 H807"/>
  <g transform="translate(310 600)"><rect class="phase done" width="180" height="70"/><text x="90" y="29" class="h">Terminal state</text><text x="90" y="52" class="t">Complete, fail, or gap</text></g><path class="msg" d="M815 650 H498"/>
</svg>
