<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">Implicit Decision Gate system context</title>
  <desc id="description">The gate combines a pinned brief, versioned scenario policy, generated artifact, typed observer evidence, human decisions, and platform review.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58708f"/></marker><style>.box{fill:#fff;stroke:#9eb7e3;stroke-width:2;rx:12}.gate{fill:#eef4ff;stroke:#145fe4;stroke-width:3}.human{fill:#fffaf0;stroke:#b36a00}.platform{fill:#f8f5ff;stroke:#7c55c7}.done{fill:#f0faf6;stroke:#198754}.h{font:700 16px system-ui,sans-serif;fill:#17325c;text-anchor:middle}.t{font:12px system-ui,sans-serif;fill:#5e687a;text-anchor:middle}.edge{stroke:#58708f;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style></defs>
  <rect width="1280" height="620" fill="#fbfcff"/><text x="640" y="38" class="h" style="font-size:24px">Gate boundary and policy ownership</text>
  <g transform="translate(50 115)"><rect class="box human" width="210" height="90"/><text x="105" y="37" class="h">Human job owner</text><text x="105" y="63" class="t">Brief and typed decisions</text></g>
  <g transform="translate(50 330)"><rect class="box platform" width="210" height="90"/><text x="105" y="37" class="h">Platform engineers</text><text x="105" y="63" class="t">Versioned scenario policy</text></g>
  <g transform="translate(410 210)"><rect class="box gate" width="300" height="150"/><text x="150" y="42" class="h" style="font-size:20px">Implicit Decision Gate</text><text x="150" y="74" class="t">Persist policy snapshot and evidence</text><text x="150" y="98" class="t">Route failure, gap, owner pause</text><text x="150" y="122" class="t">Run full retry verification</text></g>
  <g transform="translate(830 75)"><rect class="box" width="230" height="80"/><text x="115" y="33" class="h">Fresh coding process</text><text x="115" y="57" class="t">Generated artifact</text></g>
  <g transform="translate(830 210)"><rect class="box" width="230" height="105"/><text x="115" y="32" class="h">Typed observer</text><text x="115" y="57" class="t">Invariants and decisions</text><text x="115" y="78" class="t">Effects and coverage</text></g>
  <g transform="translate(830 370)"><rect class="box" width="230" height="80"/><text x="115" y="33" class="h">Evidence reviewer</text><text x="115" y="57" class="t">Brief support for decisions</text></g>
  <g transform="translate(1090 210)"><rect class="box done" width="155" height="105"/><text x="77" y="33" class="h">Wider loop</text><text x="77" y="58" class="t">Verified result</text><text x="77" y="79" class="t">or typed stop</text></g>
  <path class="edge" d="M260 160 Q330 160 410 245"/><path class="edge" d="M260 375 Q335 375 410 325"/><path class="edge" d="M710 245 Q760 135 822 120"/><path class="edge" d="M830 145 Q755 180 710 255"/><path class="edge" d="M710 285 H822"/><path class="edge" d="M830 295 H718"/><path class="edge" d="M710 325 Q760 410 822 410"/><path class="edge" d="M830 435 Q755 390 700 350"/><path class="edge" d="M710 285 H1082"/>
  <path class="edge dash" d="M155 420 V510 H560 V368"/><text x="355" y="500" class="t">Coverage gaps inform reviewed policy changes</text>
  <text x="640" y="570" class="t" style="font-size:14px">Identity, permissions, tool controls, and attributable evidence remain responsibilities of the surrounding verified loop.</text>
</svg>
