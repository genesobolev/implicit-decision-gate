[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "implicit-decision-gate"
version = "0.1.0"
description = "A durable gate for missing decisions in long-running agent work"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
idg = "implicit_decision_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/implicit_decision_gate"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "notebooks/walkthrough_helpers.py", "scripts"]

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
